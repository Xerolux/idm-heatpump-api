[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components.idm_heatpump*"]
exclude = ["images*", "docs*", "tests*"]

[project]
name = "idm_heatpump"
version = "0.2.0"
authors = [
  { name="Basti (Xerolux)", email="git@xerolux.de" },
]
description = "Python library for communicating with IDM Navigator heat pumps via Modbus TCP. Used by the official Home Assistant integration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
]
dependencies = [
    "pymodbus>=3.7.0,<4.0.0",
]

[project.urls]
"Homepage" = "https://github.com/Xerolux/idm-heatpump-api"
"Bug Tracker" = "https://github.com/Xerolux/idm-heatpump-api/issues"
