[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["idm_heatpump*"]
exclude = ["custom_components*", "images*", "docs*", "tests*", "*.egg-info*"]

[project]
name = "idm-heatpump-api"
version = "0.3.0"
authors = [
  { name="Basti (Xerolux)", email="git@xerolux.de" },
]
description = "Python library for communicating with IDM Navigator heat pumps via Modbus TCP. Used by the official Home Assistant integration."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Framework :: AsyncIO",
    "Development Status :: 4 - Beta",
]

keywords = ["idm", "heatpump", "modbus", "navigator", "home-assistant", "hass", "heating", "modbus-tcp"]
dependencies = [
    "pymodbus>=3.7.0,<4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
"Homepage" = "https://github.com/Xerolux/idm-heatpump-api"
"Bug Tracker" = "https://github.com/Xerolux/idm-heatpump-api/issues"
"Changelog" = "https://github.com/Xerolux/idm-heatpump-api/blob/main/CHANGELOG.md"
"License" = "https://opensource.org/licenses/MIT"
"Sponsor on GitHub" = "https://github.com/sponsors/Xerolux"
"Ko-fi" = "https://ko-fi.com/xerolux"
"Buy Me a Coffee" = "https://www.buymeacoffee.com/xerolux"
"PayPal" = "https://paypal.me/xerolux"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["idm_heatpump"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
