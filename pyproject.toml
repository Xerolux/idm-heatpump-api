[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idm_heatpump"
version = "0.0.1"
authors = [
  { name="Basti (Xerolux)", email="git@xerolux.de" },
]
description = "Home Assistant custom component for IDM Heatpump."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
]
dependencies = [
    "pymodbus>=3.7.0,<4.0.0",
]

[project.urls]
"Homepage" = "https://github.com/Xerolux/idm-heatpump-api"
"Bug Tracker" = "https://github.com/Xerolux/idm-heatpump-api/issues"
