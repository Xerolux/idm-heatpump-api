name: Dispatch API 0.8.2 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-release-082.yml
      - pyproject.toml

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-api-0.8.2
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether 0.8.2 still needs release
        id: guard
        run: |
          CURRENT_VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )
          if [ "$CURRENT_VERSION" = "0.8.1" ] && ! git rev-parse "v0.8.2" >/dev/null 2>&1; then
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch existing release workflow
        if: steps.guard.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --ref main \
            -f bump=auto-patch \
            -f prerelease=false
