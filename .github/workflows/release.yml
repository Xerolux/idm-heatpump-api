name: Release

on:
  workflow_dispatch:
    inputs:
      version_mode:
        description: "Version mode"
        required: true
        type: choice
        options:
          - auto-patch
          - auto-minor
          - custom
        default: auto-patch
      custom_version:
        description: "Custom version, PEP 440 (1.2.3, or a prerelease: 2.0.0b1 / 2.0.0a1 / 2.0.0rc1)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate current package
        run: |
          pytest tests/ -v --tb=short --cov=idm_heatpump --cov-report=term-missing --cov-fail-under=75
          ruff check idm_heatpump tests
          ruff format idm_heatpump tests --check
          mypy idm_heatpump

  release:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Determine next version
        id: version
        run: |
          import re, sys, os

          mode = "${{ github.event.inputs.version_mode }}"
          custom = "${{ github.event.inputs.custom_version }}".strip()

          # PEP 440, not SemVer: this is a PyPI package, so a prerelease is
          # "2.0.0b1", never "2.0.0-beta.1". pip and PyPI normalise the latter
          # to the former anyway, and a consumer pin has to spell the
          # normalised form - so that is the only form allowed here, and the
          # tag matches it exactly. See docs/RELEASE_PROCESS.md.
          VERSION_PATTERN = r"(\d+)\.(\d+)\.(\d+)((?:a|b|rc)\d+)?"

          with open("pyproject.toml") as f:
              content = f.read()
          m = re.search(rf'version\s*=\s*"{VERSION_PATTERN}"', content)
          if not m:
              print("ERROR: cannot parse version from pyproject.toml")
              sys.exit(1)

          major, minor, patch = int(m.group(1)), int(m.group(2)), int(m.group(3))
          prerelease = m.group(4)

          if mode == "custom":
              if not custom:
                  print("ERROR: custom_version is empty")
                  sys.exit(1)
              if not re.fullmatch(VERSION_PATTERN, custom):
                  print(f"ERROR: invalid version format: {custom}")
                  print("Expected PEP 440: 1.2.3, or a prerelease such as 2.0.0b1 / 2.0.0a1 / 2.0.0rc1")
                  sys.exit(1)
              new_version = custom
          elif prerelease:
              # Never auto-bump off a prerelease: the next version could be the
              # next beta or the stable it leads to, and only a maintainer knows
              # which. Ask for it explicitly.
              print(f"ERROR: current version {major}.{minor}.{patch}{prerelease} is a prerelease.")
              print("Use version_mode=custom and name the next version explicitly.")
              sys.exit(1)
          elif mode == "auto-minor":
              new_version = f"{major}.{minor + 1}.0"
          else:
              new_version = f"{major}.{minor}.{patch + 1}"

          is_prerelease = bool(re.fullmatch(VERSION_PATTERN, new_version).group(4))

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"version={new_version}", file=out)
              print(f"is_prerelease={str(is_prerelease).lower()}", file=out)
        shell: python {0}

      - name: Bump version in pyproject.toml
        run: |
          NEW="${{ steps.version.outputs.version }}"
          sed -i 's/^version = ".*"/version = "'"${NEW}"'"/' pyproject.toml
          echo "Bumped to ${NEW}"

      - name: Validate version and tag
        id: tagcheck
        run: |
          NEW="${{ steps.version.outputs.version }}"
          grep -q "^version = \"${NEW}\"$" pyproject.toml
          if git rev-parse "v${NEW}" >/dev/null 2>&1; then
            echo "Tag v${NEW} already exists (idempotent re-run)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          NEW="${{ steps.version.outputs.version }}"
          python - <<'PY' "$NEW"
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")

          # Match the version section, e.g. "## [0.6.0] - 2026-07-05"
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, text, flags=re.DOTALL)
          if not match:
              print(f"::error::Could not find CHANGELOG section for {version}")
              sys.exit(1)

          body = match.group(1).strip()
          # Write to GITHUB_OUTPUT using a heredoc-friendly delimiter.
          import os
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("body<<CHANGELOG_EOF\n")
              out.write(body)
              out.write("\nCHANGELOG_EOF\n")
          print(f"Extracted {len(body)} characters of release notes for {version}")
          PY

      - name: Parse commits since last release
        id: commits
        run: |
          NEW="${{ steps.version.outputs.version }}"
          # A prerelease compares against the newest tag of any kind; a stable
          # release compares against the previous stable, so its notes are not
          # a diff against its own beta.
          if printf '%s' "${NEW}" | grep -qE '(a|b|rc)[0-9]+$'; then
            TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'
          else
            TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          PREV_TAG=$(git tag --sort=-version:refname | grep -E "$TAG_PATTERN" | grep -v "v${NEW}" | head -1)

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --pretty=format:"- %s (%h)" | head -30)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --oneline --pretty=format:"- %s (%h)" 2>/dev/null || git log --oneline --pretty=format:"- %s (%h)" | head -30)
          fi

          BUG_FIXES=$(echo "$COMMITS" | grep -iE "(\bfix\b|\bbug\b|\bpatch\b|hotfix|bugfix)" || echo "")
          IMPROVEMENTS=$(echo "$COMMITS" | grep -iE "(\bimprove\b|\benhance\b|\bupdate\b|\brefactor\b|\boptimize\b)" || echo "")
          NEW_FEATURES=$(echo "$COMMITS" | grep -iE "(\badd\b|\bfeat\b|\bfeature\b|\bnew\b)" || echo "")

          [ -z "$BUG_FIXES" ] && BUG_FIXES="- Minor bug fixes and stability improvements"
          [ -z "$IMPROVEMENTS" ] && IMPROVEMENTS="- Performance improvements and code optimizations"
          [ -z "$NEW_FEATURES" ] && NEW_FEATURES="- Enhanced IDM Heatpump functionality"

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG_LINK="Full changelog: Initial release"
          else
            CHANGELOG_URL="${{ github.server_url }}/${{ github.repository }}/compare/$PREV_TAG...v${NEW}"
            CHANGELOG_LINK="[Full changelog: $PREV_TAG...v${NEW}]($CHANGELOG_URL)"
          fi

          {
            echo "bug-fixes<<EOF"
            echo "$BUG_FIXES"
            echo "EOF"
            echo "improvements<<EOF"
            echo "$IMPROVEMENTS"
            echo "EOF"
            echo "new-features<<EOF"
            echo "$NEW_FEATURES"
            echo "EOF"
            echo "changelog-link<<EOF"
            echo "$CHANGELOG_LINK"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build package
        run: |
          python -m build
          twine check dist/*

      - name: Inspect built package
        run: |
          python -m venv /tmp/idm_heatpump_api_release
          /tmp/idm_heatpump_api_release/bin/python -m pip install --upgrade pip
          /tmp/idm_heatpump_api_release/bin/python -m pip install dist/*.whl
          /tmp/idm_heatpump_api_release/bin/python - <<'PY'
          from pathlib import Path

          import idm_heatpump
          from idm_heatpump import IdmModbusClient, build_register_map

          assert Path(idm_heatpump.__file__).with_name("py.typed").is_file()
          assert IdmModbusClient("127.0.0.1").host == "127.0.0.1"
          assert "outdoor_temp" in build_register_map(circuits=["A"])
          PY

      - name: Commit and tag
        if: steps.tagcheck.outputs.exists != 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          if git diff --cached --quiet; then
            echo "pyproject.toml already contains ${NEW}; no version commit needed"
          else
            git commit -m "chore: bump version to ${NEW}"
          fi
          git tag "v${NEW}"
          gh auth setup-git
          git push origin HEAD:main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          # A prerelease must not become the repository's latest release, or
          # everyone landing on the releases page is pointed at a beta.
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          make_latest: ${{ steps.version.outputs.is_prerelease == 'true' && 'false' || 'true' }}
          body: |
            ## v${{ steps.version.outputs.version }} — IDM Heatpump API

            [![GitHub Sponsor](https://img.shields.io/github/sponsors/xerolux?logo=github&style=for-the-badge&color=blue)](https://github.com/sponsors/xerolux)
            [![Ko-Fi](https://img.shields.io/badge/Ko--fi-xerolux-blue?logo=ko-fi&style=for-the-badge)](https://ko-fi.com/xerolux)
            [![Buy Me A Coffee](https://img.shields.io/badge/Buy%20Me%20A%20Coffee-xerolux-yellow?logo=buy-me-a-coffee&style=for-the-badge)](https://www.buymeacoffee.com/xerolux)
            [![PayPal](https://img.shields.io/badge/PayPal-xerolux-blue?logo=paypal&style=for-the-badge)](https://paypal.me/xerolux)
            [![Tesla Referral](https://img.shields.io/badge/Tesla-Referral-red?logo=tesla&style=for-the-badge)](https://ts.la/sebastian564489)

            ### Release Notes
            ${{ steps.notes.outputs.body }}

            ### Improvements
            ${{ steps.commits.outputs.improvements }}

            ### Bug Fixes
            ${{ steps.commits.outputs.bug-fixes }}

            ---

            ### Installation
            ```bash
            pip install idm-heatpump-api==${{ steps.version.outputs.version }}
            ```
            `pip install idm-heatpump-api` resolves to the newest stable release;
            a prerelease has to be named explicitly, as above.

            ---

            ${{ steps.commits.outputs.changelog-link }}

            ---

            ### Support
            This library is developed in spare time — your support motivates further features and updates!

            [![GitHub Sponsor](https://img.shields.io/github/sponsors/xerolux?logo=github&style=for-the-badge&color=blue)](https://github.com/sponsors/xerolux)
            [![Ko-Fi](https://img.shields.io/badge/Ko--fi-xerolux-blue?logo=ko-fi&style=for-the-badge)](https://ko-fi.com/xerolux)
            [![Buy Me A Coffee](https://img.shields.io/badge/Buy%20Me%20A%20Coffee-xerolux-yellow?logo=buy-me-a-coffee&style=for-the-badge)](https://www.buymeacoffee.com/xerolux)
            [![PayPal](https://img.shields.io/badge/PayPal-xerolux-blue?logo=paypal&style=for-the-badge)](https://paypal.me/xerolux)
            [![Tesla Referral](https://img.shields.io/badge/Tesla-Referral-red?logo=tesla&style=for-the-badge)](https://ts.la/sebastian564489)

            ---

            - [Report a bug](https://github.com/${{ github.repository }}/issues/new?template=bug_report.md)
            - [Request a feature](https://github.com/${{ github.repository }}/issues)
            - [Contribute](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md)

            **Developed by:** [Xerolux](https://github.com/Xerolux) | **License:** MIT
          files: |
            dist/*
