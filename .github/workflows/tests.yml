name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        pymodbus-spec:
          - "pymodbus==3.12.1"
          - "pymodbus>=3.12.1,<4.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install "${{ matrix.pymodbus-spec }}"

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=idm_heatpump --cov-report=term-missing --cov-fail-under=75

      - name: Run linting
        run: |
          pip install ruff
          ruff check idm_heatpump tests
          ruff format idm_heatpump tests --check

      - name: Check type hints
        run: |
          pip install mypy
          mypy idm_heatpump

      - name: Check typed package metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          import idm_heatpump

          marker = Path(idm_heatpump.__file__).with_name("py.typed")
          assert marker.is_file(), f"Missing typed package marker: {marker}"
          PY

          cat > /tmp/idm_type_consumer.py <<'PY'
          from idm_heatpump import IdmModbusClient, build_register_map

          client: IdmModbusClient = IdmModbusClient("127.0.0.1")
          registers = build_register_map()

          reveal_type(client)
          reveal_type(registers)
          PY

          mypy /tmp/idm_type_consumer.py

      - name: Build and inspect package artifacts
        run: |
          pip install build twine
          python -m build
          twine check dist/*

          python -m venv /tmp/idm_heatpump_api_import
          /tmp/idm_heatpump_api_import/bin/python -m pip install --upgrade pip

          # Plain wheel first: since 2.0.0 the base package must be usable with
          # no Modbus stack installed (#85).
          /tmp/idm_heatpump_api_import/bin/python -m pip install dist/*.whl
          /tmp/idm_heatpump_api_import/bin/python - <<'PY'
          from pathlib import Path

          import idm_heatpump
          from idm_heatpump import IdmModbusError, IllegalAddressError, build_register_map

          assert Path(idm_heatpump.__file__).with_name("py.typed").is_file()
          assert issubclass(IllegalAddressError, IdmModbusError)
          assert "outdoor_temp" in build_register_map(circuits=["A"])
          PY

          # Then the extra, which is what the built-in transport needs: a client
          # constructed without transport= builds it, so this covers that path.
          /tmp/idm_heatpump_api_import/bin/python -m pip install "$(echo dist/*.whl)[pymodbus]"
          /tmp/idm_heatpump_api_import/bin/python - <<'PY'
          from idm_heatpump import IdmModbusClient

          assert IdmModbusClient("127.0.0.1").host == "127.0.0.1"
          PY

      - name: Check out Home Assistant integration contract tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Xerolux/idm-heatpump-hass
          ref: main
          path: integration-contract

      - name: Run Home Assistant integration contract tests
        run: |
          PYTHONPATH="$PWD:$PWD/integration-contract" pytest \
            integration-contract/tests/test_library_client.py \
            integration-contract/tests/test_adapter_helpers.py \
            -q

  no-pymodbus:
    # Since 2.0.0 pymodbus is an optional extra (#85). This job installs the
    # package without it and proves the property that makes that true: the
    # package imports, the public API is usable, and no pymodbus module is
    # loaded. The main matrix cannot cover this - most tests construct a client
    # without injecting a transport, which deliberately requires the extra.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip

      - name: Install without the pymodbus extra
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Assert no Modbus stack was pulled in
        run: |
          python - <<'PY'
          import importlib.metadata as md

          for name in ("pymodbus", "modbus-connection", "tmodbus"):
              try:
                  md.distribution(name)
              except md.PackageNotFoundError:
                  continue
              raise SystemExit(f"{name} must not be installed by the base package")
          print("base package pulled in no Modbus stack")
          PY

      - name: Import and use the public API without pymodbus
        run: |
          python - <<'PY'
          import sys

          import idm_heatpump
          from idm_heatpump import IdmDeviceError, IdmModbusError, IllegalAddressError, build_register_map

          assert "pymodbus" not in sys.modules, sorted(m for m in sys.modules if m.startswith("pymodbus"))
          assert issubclass(IllegalAddressError, IdmModbusError)
          assert IdmDeviceError("refused", exception_code=4).exception_code == 4
          assert build_register_map()
          print("public API works with no Modbus stack installed")
          PY

      - name: Run the contract tests that pin this
        run: pytest tests/test_exceptions.py -v --tb=short
