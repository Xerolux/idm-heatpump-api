name: Publish

# Publishes the package to PyPI automatically whenever a version tag (v*) is
# pushed. This complements release.yml (manual prepare/bump/tag flow): once a
# tag lands on main, this workflow builds the dist and uploads it to PyPI using
# the trusted-publishing OIDC token (id-token: write).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example, v0.7.7)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.x"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Inspect built package
        run: |
          python -m venv /tmp/idm_release_check
          /tmp/idm_release_check/bin/python -m pip install --upgrade pip
          /tmp/idm_release_check/bin/python -m pip install dist/*.whl
          /tmp/idm_release_check/bin/python - <<'PY'
          from pathlib import Path

          import idm_heatpump
          from idm_heatpump import IdmModbusClient, build_register_map

          assert Path(idm_heatpump.__file__).with_name("py.typed").is_file()
          assert IdmModbusClient("127.0.0.1").host == "127.0.0.1"
          assert "outdoor_temp" in build_register_map(circuits=["A"])
          PY

      - name: Validate release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="${GITHUB_REF_NAME}"
          fi

          case "$REF" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Release tag must look like v1.2.3, got: $REF" >&2
              exit 1
              ;;
          esac

          VERSION="${REF#v}"
          if ! grep -q "^version = \"${VERSION}\"$" pyproject.toml; then
            echo "pyproject.toml version does not match ${REF}" >&2
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
