name: Publish

# Publishes the package to PyPI automatically whenever a version tag (v*) is
# pushed. This complements release.yml (manual prepare/bump/tag flow): once a
# tag lands on main, this workflow builds the dist and uploads it to PyPI using
# the trusted-publishing OIDC token (id-token: write).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Inspect built package
        run: |
          python -m venv /tmp/idm_release_check
          /tmp/idm_release_check/bin/python -m pip install --upgrade pip
          /tmp/idm_release_check/bin/python -m pip install dist/*.whl
          /tmp/idm_release_check/bin/python - <<'PY'
          from pathlib import Path

          import idm_heatpump
          from idm_heatpump import IdmModbusClient, build_register_map

          assert Path(idm_heatpump.__file__).with_name("py.typed").is_file()
          assert IdmModbusClient("127.0.0.1").host == "127.0.0.1"
          assert "outdoor_temp" in build_register_map(circuits=["A"])
          PY

      - name: Derive version from tag
        id: tag
        run: |
          REF="${GITHUB_REF_NAME:-}"
          if [ -z "$REF" ]; then
            REF="${{ github.event.inputs.tag || '' }}"
          fi
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          password: ${{ secrets.PYPI }}
