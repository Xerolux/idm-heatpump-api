name: Sync docs to GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Clone wiki
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" /tmp/wiki

      - name: Sync docs content
        run: |
          # docs/New is source material for the register-map audit (the raw
          # vendor manual and working notes) and is not mirrored. It is not
          # deleted from the wiki by this sync either: --delete-excluded would
          # also remove the clone's .git directory.
          rsync -av --delete --exclude='.git/' --exclude='New/' docs/ /tmp/wiki/

      - name: Commit and push wiki changes
        working-directory: /tmp/wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes detected."
          else
            git commit -m "docs: sync wiki from docs folder [skip ci]"
            git push origin HEAD
          fi
