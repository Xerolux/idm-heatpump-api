name: Dependabot Auto-merge

# Dependabot owns the GitHub Actions pins in this repository. Its pull requests
# were piling up waiting for somebody to press merge (#107 sat four days with
# every check green), which is how an action pin goes stale in a repository that
# pins every action by SHA. This merges them as soon as their checks are green —
# the same guard the integration repository has run since October 2026.
#
# pull_request_target is required: a pull request opened by Dependabot runs with
# a read-only token, which cannot merge anything. The PR's code is deliberately
# never checked out here, so nothing from the branch is executed with that
# write-capable token — this workflow only talks to the GitHub API.
#
# The fallback wait must not use `gh pr checks --watch`: this workflow runs on
# pull_request_target, so its own job is a check run on the pull request, and a
# watch over all checks waits for this very job to finish. That deadlock was
# only resolved by the job timeout — #163 and #164 each burned the full 90
# minutes that way while every real check was green after one minute. The job
# below polls the Checks API instead and skips the check runs of its own
# workflow run.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    name: Merge when green
    if: github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Merge the Dependabot pull request once its checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail

          # Where the repository has auto-merge enabled, GitHub does the waiting
          # and merges the moment the required checks report green.
          if gh pr merge "$PR" --repo "$REPO" --merge --auto; then
            echo "Auto-merge armed for #$PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Otherwise wait here. `gh pr checks --watch` is not usable (see the
          # header comment): this job would wait for itself. Poll the Checks API
          # for the PR head instead and ignore our own workflow run.
          export OWN_RUN="/actions/runs/${GITHUB_RUN_ID}/"
          CHECKS_URL="repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100"
          echo "Repository auto-merge unavailable; watching the checks of #$PR."

          # Give Actions a moment to register the check runs of a freshly
          # opened pull request, so the loop below can never mistake an empty
          # check list for a completed one.
          sleep 30

          while :; do
            JSON="$(gh api "$CHECKS_URL")"

            PENDING="$(jq -r '[.check_runs[]
                | select((.details_url // "") | contains(env.OWN_RUN) | not)
                | select(.status != "completed")
                | .name] | join(", ")' <<<"$JSON")"
            TOTAL="$(jq -r '[.check_runs[]
                | select((.details_url // "") | contains(env.OWN_RUN) | not)]
                | length' <<<"$JSON")"

            if [[ "$TOTAL" -gt 0 && -z "$PENDING" ]]; then
              break
            fi

            echo "Waiting for checks of $HEAD_SHA ($TOTAL reported, pending: ${PENDING:-none yet})."
            sleep 30
          done

          # Every other check has finished. Refuse to merge on any red one so a
          # broken pull request fails this job and stays open.
          RED="$(jq -r '[.check_runs[]
              | select((.details_url // "") | contains(env.OWN_RUN) | not)
              | select(.conclusion == "failure" or .conclusion == "cancelled"
                       or .conclusion == "timed_out" or .conclusion == "startup_failure")
              | .name] | join(", ")' <<<"$JSON")"
          if [[ -n "$RED" ]]; then
            echo "Failing checks prevent auto-merge: $RED" >&2
            exit 1
          fi

          gh pr merge "$PR" --repo "$REPO" --merge
          echo "Merged #$PR into main." >> "$GITHUB_STEP_SUMMARY"
